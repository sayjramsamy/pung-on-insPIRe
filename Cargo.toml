[package]
name = "pung"
version = "0.1.0"
authors = ["Sebastian Angel <sebs@cs.utexas.edu>"]
build = "build.rs"

[workspace]

[workspace.dependencies]
inspire = { path = "../private-membership/research/InsPIRe" }
# Same rev as inspire's own dependency, so Cargo unifies them; Pung names its types (Params, Client).
spiral-rs = { git = "https://github.com/menonsamir/spiral-rs.git", rev = "6929441" }

[build-dependencies]
capnpc = "0.7.3"
cc = "1.0"
cmake = "0.1.20"

[dependencies]
time = "0.1.35"
capnp = "0.7.4"
capnp-rpc = "0.7.4"
gj = "0.2.0"
gjio = "0.1.3"
timely = "0.3.0"
timely_communication = "0.1.8"
abomonation = "0.4.3"
byteorder = "1.0.0"
rand = "0.3.15"
rust-crypto = "0.2.36"
quicksort = ">= 1.1.0"
libc = "0.2.19"
getopts = "0.2.14"
bit-vec = "0.4.3"
inspire = { workspace = true }
spiral-rs = { workspace = true }

[dev-dependencies]
criterion = "0.1.2"

[features]
# Off by default: Pung's PIR backend is SealPIR unless this is enabled (see
# src/db/mod.rs). Built into a separate target dir (CARGO_TARGET_DIR=target-inspire)
# so the two builds coexist.
inspire = []

# Old crates hand-fixed to build on modern rustc (see patches/crates/*):
# capnp: borrow-check fix in src/private/layout.rs; gjio: unaligned read of packed epoll_event in
# src/sys/unix/epoll.rs.
[patch.crates-io]
capnp = { path = "patches/crates/capnp-0.7.5" }
gjio = { path = "patches/crates/gjio-0.1.3" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
panic = 'unwind'

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
